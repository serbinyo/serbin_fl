version: '3.3'

services:
  nginx:
    image: nginx:latest
    # Назовем свой контейнер по красивому
    container_name: nginx_progunity
    # Проброс портов
    ports:
      - "80:80" # flarum не показывает js и css если в урл есть порт
      - "4443:443"
    # Проброс папок
    volumes:
      - ./Nginx/core:/etc/nginx/conf.d
      - ../:/var/www/
      - ./Nginx/Logs:/var/log/nginx/
    # Укажем зависимости
    links:
      - php
  mariadb:
    image: mariadb:10.2
    ports:
      - "3306:3306"
    container_name: mariadb_progunity
    # Пропишем настройки, предлагаю использовать вместо mypassword более сложный пароль, он пренадлежит root
    environment:
      - MARIADB_ROOT_PASSWORD=devroot
      - MARIADB_DATABASE=progunity_dev
      - MARIADB_USER=serbin
      - MARIADB_PASSWORD=serbin_password
    volumes:
      - ./mariadb:/var/lib/mysql
  php:
    # Билдим с помощью dockerfile указав директорию где он лежит
    build: ./PHP
    container_name: php-fpm_progunity
    volumes:
      - ../:/var/www
    links:
      - mariadb
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - 8090:80
    links:
      - mariadb:db
